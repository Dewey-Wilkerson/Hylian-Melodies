# Hylian Melodies settings. Each player's copy lives in ~/.local/share/hylian-melodies/hylian-melodies.ini and is
# never overwritten by the package; this file is only the default for a new player.
# Lines are "key = value"; lines starting with # are ignored.

# --- video
# fullscreen = 0
# resolution = 1              # 1: native (the game's pixel art at 1:1, recommended); 2-8: that many times; 0: match the window
# upscale_filter = 0          # to the window: 0 sharp pixels (default), 1 smooth, 2 nearest, 3 pixel-perfect
# frame_pacing = 1            # 1: the Switch display's steady 60 Hz (recommended); 0: the game's own limiter (~61 fps)
# gpu = auto                  # which graphics card: auto (a separate card first) or N from the log's "[vk] gpu N" lines

# --- audio (docs/audio.md; sound and music volume are in the game's own Options > Audio)
# audio_period = 256          # device period in frames at 48 kHz: 256 = 5.3 ms; raise (512, 1024) if you hear crackles
# audio_queue_ms = 0          # what our output stream may hold before taking the next game buffer; 0 = one period

# --- game
# language = en-US            # the game's text language; default: your system's

# --- troubleshooting (leave these alone unless something is wrong; docs/env-vars.md)
# shader_cache = 1            # 0: rebuild the shaders at every start (once, after a graphics driver update)
# vk_validation = 0           # 1: the graphics driver's complaints to the log (needs the Vulkan validation layers)
# log_input = 0               # 1: the buttons and keys the game receives to the log
# audio_stats = 0             # N: a line about the sound output every N seconds in the log
